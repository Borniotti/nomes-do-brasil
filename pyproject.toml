[project]
name = "nomes-do-brasil"
version = "1.0.0"
description = "Como os nomes mais comuns do Brasil mudaram de década em década (dados do Censo 2010, IBGE)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD"]
ignore = ["PD010", "PD013"]  # pivot e stack são mais claros aqui do que pivot_table e melt
